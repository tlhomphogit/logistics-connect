# Application Settings
spring.application.name=shipment-service

# Database Connection Settings (mapped to custom port 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/shipment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

# The variables below pull securely from environment, defaulting to 'root' if not found
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect