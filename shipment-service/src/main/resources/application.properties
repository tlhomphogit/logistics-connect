# Application Settings
spring.application.name=shipment-service

# Database Connection Settings (mapped to custom port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/logistics_db
spring.datasource.username=${POSTGRES_USER:logistics_user}
spring.datasource.password=${POSTGRES_PASSWORD:logistics_secure_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect