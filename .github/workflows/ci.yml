name: LogisticsConnect CI Foundation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Compile and Run Tests
        # Testcontainers dynamically spins up the required PostgreSQL instance
        run: ./mvnw clean test

      - name: Upload Surefire Test Reports
        # This step only executes if the tests fail, providing diagnostic XMLs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7