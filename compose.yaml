services:
  postgres:
    image: 'postgres:18'
    container_name: logistics-postgres
    ports:
      - '5433:5432'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init-multiple-databases.sql:/docker-entrypoint-initdb.d/init-multiple-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  artemis:
    image: 'apache/activemq-artemis:2.44.0'
    container_name: logistics-artemis
    ports:
      - '61616:61616' # JMS Port
      - '8161:8161'   # Web Console Port (for monitoring queues)
    environment:
      - 'ARTEMIS_USER=${ARTEMIS_USER}'
      - 'ARTEMIS_PASSWORD=${ARTEMIS_PASSWORD}'

  shipment-service:
    build:
      context: ./shipment-service
    container_name: logistics-shipment-service
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shipment_db'
      - 'SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}'
      - 'SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}'
      - 'SPRING_JPA_HIBERNATE_DDL_AUTO=update'
    depends_on:
      postgres:
        condition: service_healthy

  tracking-service:
    build:
      context: ./tracking-service
    container_name: logistics-tracking-service
    ports:
      - '8081:8081'
    environment:
      - 'SPRING_ARTEMIS_BROKER_URL=tcp://artemis:61616'
      - 'SPRING_ARTEMIS_USER=${ARTEMIS_USER}'
      - 'SPRING_ARTEMIS_PASSWORD=${ARTEMIS_PASSWORD}'
      - 'SHIPMENT_SERVICE_URL=http://shipment-service:8080'
    depends_on:
      - artemis
      - shipment-service

  notification-service:
    build:
      context: ./notification-service
    container_name: logistics-notification-service
    ports:
      - '8082:8082'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notification_db'
      - 'SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}'
      - 'SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}'
      - 'SPRING_ARTEMIS_BROKER_URL=tcp://artemis:61616'
      - 'SPRING_ARTEMIS_USER=${ARTEMIS_USER}'
      - 'SPRING_ARTEMIS_PASSWORD=${ARTEMIS_PASSWORD}'
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_started

volumes:
  postgres-data: