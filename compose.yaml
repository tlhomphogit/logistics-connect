services:
  mysql:
    image: 'mysql:8.4.11'
    container_name: logistics-mysql
    ports:
      - '3307:3306'
    environment:
      - 'MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}'
      - 'MYSQL_DATABASE=${MYSQL_DATABASE}'
      - 'MYSQL_USER=${MYSQL_USER}'
      - 'MYSQL_PASSWORD=${MYSQL_PASSWORD}'
    volumes:
      - mysql-data:/var/lib/mysql

  artemis:
    image: 'apache/activemq-artemis:2.44.0'
    container_name: logistics-artemis
    ports:
      - '61616:61616' # JMS Port
      - '8161:8161'   # Web Console Port (for monitoring queues)
    environment:
      - 'ARTEMIS_USER=admin'
      - 'ARTEMIS_PASSWORD=admin'

volumes:
  mysql-data: